name: Build Windows release

# Публикация релиза:  git tag v1.0.0 && git push origin v1.0.0
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - run: pip install -r requirements-dev.txt

      - name: Version in main.py must match the tag
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        run: |
          $v = (Select-String -Path main.py -Pattern '^__version__ = "(.+)"').Matches[0].Groups[1].Value
          $tag = "${{ github.ref_name }}".TrimStart("v")
          if ($v -ne $tag) { Write-Error "main.py has version $v but the tag is $tag"; exit 1 }

      - run: python -m playwright install chromium
      - run: python -m pytest -q

      - name: Build exe
        run: >
          python -m PyInstaller --noconfirm --clean --windowed
          --name VKDropsMiner --icon assets/icon.ico
          --collect-all customtkinter --collect-all playwright
          --hidden-import pystray._win32 main.py

      - name: Pack
        shell: pwsh
        run: |
          Copy-Item config.example.yaml dist/VKDropsMiner/
          Copy-Item README.md dist/VKDropsMiner/
          $name = "VKDropsMiner-${{ github.ref_name }}-win64.zip"
          Compress-Archive -Path dist/VKDropsMiner/* -DestinationPath $name
          "ASSET=$name" | Out-File -FilePath $env:GITHUB_ENV -Append

      - uses: actions/upload-artifact@v4
        with:
          name: VKDropsMiner-win64
          path: ${{ env.ASSET }}

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ env.ASSET }}
          generate_release_notes: true
